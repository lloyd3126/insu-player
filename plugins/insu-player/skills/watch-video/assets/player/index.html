<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071617" />
    <title>INSU Player 本機放映室</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2e7d5;
        --muted: #a8aaa0;
        --line: rgb(244 240 232 / 14%);
        --panel: #0c2020;
        --panel-raised: #112a29;
        --black: #071617;
        --signal: #ff6542;
        --signal-soft: #57d7bf;
        --danger: #ff7b70;
        --plyr-color-main: var(--signal);
        font-family: "Avenir Next", Avenir, "PingFang TC", sans-serif;
        background: var(--black);
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--black);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
        content: "";
        opacity: 0.55;
        pointer-events: none;
      }

      body::after {
        position: fixed;
        top: 110px;
        right: -230px;
        z-index: -2;
        width: 540px;
        height: 540px;
        border: 1px solid rgb(87 215 191 / 16%);
        border-radius: 50%;
        box-shadow: 0 0 0 62px rgb(87 215 191 / 3%), 0 0 0 124px rgb(87 215 191 / 1.5%);
        content: "";
        pointer-events: none;
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(32px, 6vw, 76px) 0 56px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        margin-bottom: 24px;
      }

      .player-brand {
        display: inline-flex;
        gap: 11px;
        align-items: center;
        margin-bottom: clamp(28px, 5vw, 58px);
        color: var(--ink);
        font-size: .72rem;
        font-weight: 750;
        letter-spacing: .17em;
      }

      .player-brand svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: var(--signal);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .player-brand small {
        display: block;
        margin-top: 5px;
        color: #647775;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: .52rem;
        letter-spacing: .08em;
      }

      .kicker {
        margin: 0 0 8px;
        color: var(--signal-soft);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 18ch;
        margin: 0;
        font-family: "Iowan Old Style", "Songti TC", Baskerville, serif;
        font-size: clamp(2rem, 4.7vw, 4.9rem);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 0.94;
        text-wrap: balance;
      }

      .runtime-badge {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        padding: 9px 12px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .runtime-badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: 0 0 16px rgb(255 101 66 / 75%);
        content: "";
      }

      .player-shell {
        overflow: hidden;
        border: 1px solid var(--line);
        background: #000;
        box-shadow: 12px 12px 0 rgb(255 101 66 / 10%), 0 28px 80px rgb(0 0 0 / 55%);
      }

      .player-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .player-wrap video,
      .player-wrap .plyr {
        width: 100%;
        height: 100%;
      }

      .player-wrap video {
        display: block;
        object-fit: contain;
      }

      .custom-captions {
        position: absolute;
        right: 6%;
        bottom: clamp(4.4rem, 9%, 6.4rem);
        left: 6%;
        z-index: 3;
        max-width: 88%;
        margin: 0 auto;
        display: grid;
        justify-items: center;
        gap: 0.35rem;
        pointer-events: none;
      }

      .custom-caption {
        width: fit-content;
        max-width: 100%;
        padding: 0.42em 0.72em 0.48em;
        border-radius: 0.12em;
        background: rgb(3 11 12 / 86%);
        box-decoration-break: clone;
        color: #fff;
        font-family: "Avenir Next", Avenir, "PingFang TC", sans-serif;
        font-size: clamp(1rem, 2.15vw, 1.55rem);
        font-weight: 650;
        line-height: 1.42;
        text-align: center;
        text-shadow: 0 1px 3px #000;
      }

      .custom-caption[hidden] {
        display: none;
      }

      .control-deck {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.6fr);
        border-top: 1px solid var(--line);
        background: var(--panel);
      }

      .status-panel,
      .caption-panel {
        min-height: 112px;
        padding: 22px 24px;
      }

      .caption-panel {
        border-left: 1px solid var(--line);
        background: var(--panel-raised);
      }

      .label {
        display: block;
        margin-bottom: 9px;
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .status {
        margin: 0;
        color: var(--ink);
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .caption-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .caption-row + .caption-row {
        margin-top: 10px;
      }

      select {
        min-width: 145px;
        border: 0;
        border-bottom: 1px solid #58544b;
        border-radius: 0;
        padding: 8px 28px 8px 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }

      select:focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 4px;
      }

      .caption-status {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .caption-status[data-error="true"] {
        color: var(--danger);
      }

      .footnote {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 16px;
        color: #77736c;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.68rem;
        line-height: 1.5;
      }

      body.embed {
        min-height: 0;
        overflow: hidden;
        background: #000;
      }

      body.embed::before,
      body.embed::after,
      body.embed .masthead,
      body.embed .control-deck,
      body.embed .footnote {
        display: none;
      }

      body.embed main {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      body.embed .player-shell {
        border: 0;
        box-shadow: none;
      }

      body.embed .player-wrap {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
      }

      @media (max-width: 720px) {
        main {
          width: min(100% - 24px, 1180px);
          padding-top: 28px;
        }

        .masthead,
        .control-deck {
          grid-template-columns: 1fr;
        }

        .runtime-badge {
          justify-self: start;
        }

        .caption-panel {
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .status-panel,
        .caption-panel {
          min-height: auto;
          padding: 18px;
        }

        .custom-captions {
          bottom: 3.6rem;
        }

        .footnote {
          display: block;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .masthead,
        .player-shell,
        .footnote {
          animation: arrive 520ms ease-out both;
        }

        .player-shell {
          animation-delay: 80ms;
        }

        .footnote {
          animation-delay: 150ms;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header class="masthead">
        <div>
          <div class="player-brand" aria-label="INSU Player">
            <svg class="lucide lucide-circle-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
            <span>INSU PLAYER<small>TAIWAN INSULARIS EDITION</small></span>
          </div>
          <p id="kicker" class="kicker">INSU · local screening</p>
          <h1 id="page-title">本機字幕放映室</h1>
        </div>
        <span id="runtime-badge" class="runtime-badge">INITIALIZING</span>
      </header>

      <section class="player-shell" aria-label="本機影音播放器">
        <div class="player-wrap">
          <video id="player" playsinline controls preload="metadata"></video>
          <div id="custom-captions" class="custom-captions" aria-live="polite">
            <div id="primary-caption" class="custom-caption" hidden></div>
            <div id="secondary-caption" class="custom-caption" hidden></div>
          </div>
        </div>

        <div class="control-deck">
          <div class="status-panel">
            <span class="label">Playback status</span>
            <p id="status" class="status">正在讀取影音設定……</p>
          </div>

          <div class="caption-panel">
            <span class="label">Subtitle tracks</span>
            <div class="caption-row">
              <select id="primary-caption-language" aria-label="第一字幕" aria-describedby="primary-caption-status"></select>
              <span id="primary-caption-status" class="caption-status">等待載入</span>
            </div>
            <div class="caption-row">
              <select id="secondary-caption-language" aria-label="第二字幕" aria-describedby="secondary-caption-status"></select>
              <span id="secondary-caption-status" class="caption-status">等待載入</span>
            </div>
          </div>
        </div>
      </section>

      <footer class="footnote">
        <span>HTTP REQUIRED · VTT SYNCED LOCALLY</span>
        <span id="engine-label">ENGINE · NATIVE VIDEO</span>
      </footer>
    </main>

    <script src="config.js"></script>
    <script>
      (() => {
        "use strict";

        const defaults = {
          videoId: "standalone",
          title: "INSU Player · 本機字幕放映室",
          kicker: "INSU · local screening",
          video: { src: "video.mp4", type: "video/mp4" },
          defaultLanguage: "zh-TW",
          captions: [
            { code: "zh-TW", label: "繁體中文", src: "captions.zh-TW.vtt" },
            { code: "en", label: "English", src: "captions.en.vtt" },
          ],
        };

        const supplied = window.INSU_PLAYER_CONFIG || {};
        const config = {
          ...defaults,
          ...supplied,
          video: { ...defaults.video, ...(supplied.video || {}) },
          captions: Array.isArray(supplied.captions) ? supplied.captions : defaults.captions,
        };

        const video = document.querySelector("#player");
        const status = document.querySelector("#status");
        const pageTitle = document.querySelector("#page-title");
        const kicker = document.querySelector("#kicker");
        const runtimeBadge = document.querySelector("#runtime-badge");
        const engineLabel = document.querySelector("#engine-label");
        const captionContainer = document.querySelector("#custom-captions");
        const captionBoxes = {
          primary: document.querySelector("#primary-caption"),
          secondary: document.querySelector("#secondary-caption"),
        };
        const captionLanguages = {
          primary: document.querySelector("#primary-caption-language"),
          secondary: document.querySelector("#secondary-caption-language"),
        };
        const captionStatuses = {
          primary: document.querySelector("#primary-caption-status"),
          secondary: document.querySelector("#secondary-caption-status"),
        };
        const captionTracks = {
          primary: { activeCues: [], lastCueIndex: -1 },
          secondary: { activeCues: [], lastCueIndex: -1 },
        };
        let animationFrame = 0;
        let lastTimeMessage = 0;

        const isEmbedded = window.parent !== window && new URLSearchParams(window.location.search).get("embed") === "1";
        if (isEmbedded) document.body.classList.add("embed");

        function postToParent(type, extra = {}) {
          if (!isEmbedded) return;
          window.parent.postMessage({ type, videoId: config.videoId, ...extra }, window.location.origin);
        }

        document.title = config.title;
        pageTitle.textContent = config.title;
        kicker.textContent = config.kicker;
        const videoSource = document.createElement("source");
        videoSource.src = config.video.src;
        if (config.video.type) videoSource.type = config.video.type;
        video.append(videoSource);

        Object.values(captionLanguages).forEach((select) => {
          select.add(new Option("關閉字幕", "off"));
          config.captions.forEach((track) => {
            select.add(new Option(track.code, track.code));
          });
        });

        function parseTimecode(value) {
          const parts = value.trim().replace(",", ".").split(":");
          if (parts.length === 2) parts.unshift("0");
          if (parts.length !== 3) return Number.NaN;
          return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + Number(parts[2]);
        }

        function cleanCueText(value) {
          return value
            .replace(/<\/?c(?:\.[^>]*)?>/g, "")
            .replace(/<\d{2}:\d{2}(?::\d{2})?\.\d{3}>/g, "")
            .replace(/<[^>]*>/g, "")
            .replace(/&nbsp;/g, " ")
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/\s+/g, " ")
            .trim();
        }

        function parseVtt(source) {
          const cues = [];
          const blocks = source
            .replace(/^\uFEFF/, "")
            .replace(/\r\n?/g, "\n")
            .split(/\n[\t ]*\n+/);

          for (const block of blocks) {
            const lines = block.split("\n");
            const timingIndex = lines.findIndex((line) => /^(\S+)\s+-->\s+(\S+)/.test(line));
            if (timingIndex < 0) continue;
            const timing = lines[timingIndex].match(/^(\S+)\s+-->\s+(\S+)/);
            if (!timing) continue;

            const start = parseTimecode(timing[1]);
            const end = parseTimecode(timing[2]);
            const text = cleanCueText(lines.slice(timingIndex + 1).join("\n"));
            if (text && Number.isFinite(start) && Number.isFinite(end) && end > start) {
              cues.push({ start, end, text });
            }
          }

          return cues.sort((a, b) => a.start - b.start);
        }

        function findCueIndex(track, currentTime) {
          if (
            track.lastCueIndex >= 0 &&
            track.activeCues[track.lastCueIndex] &&
            currentTime >= track.activeCues[track.lastCueIndex].start &&
            currentTime < track.activeCues[track.lastCueIndex].end
          ) {
            return track.lastCueIndex;
          }

          let low = 0;
          let high = track.activeCues.length - 1;
          while (low <= high) {
            const middle = Math.floor((low + high) / 2);
            const cue = track.activeCues[middle];
            if (currentTime < cue.start) high = middle - 1;
            else if (currentTime >= cue.end) low = middle + 1;
            else return middle;
          }
          return -1;
        }

        function updateCaption(position) {
          const track = captionTracks[position];
          const captionBox = captionBoxes[position];
          const cueIndex = findCueIndex(track, video.currentTime || 0);
          track.lastCueIndex = cueIndex;
          const text = cueIndex >= 0 ? track.activeCues[cueIndex].text : "";
          captionBox.textContent = text;
          captionBox.hidden = !text;
        }

        function updateCaptions() {
          updateCaption("primary");
          updateCaption("secondary");
        }

        function followPlayback() {
          updateCaptions();
          if (!video.paused && !video.ended) {
            animationFrame = requestAnimationFrame(followPlayback);
          }
        }

        function setCaptionMessage(position, message, isError = false) {
          captionStatuses[position].textContent = message;
          captionStatuses[position].dataset.error = String(isError);
        }

        async function loadCaptions(position, language) {
          cancelAnimationFrame(animationFrame);
          const trackState = captionTracks[position];
          captionBoxes[position].hidden = true;
          trackState.lastCueIndex = -1;

          if (language === "off") {
            trackState.activeCues = [];
            setCaptionMessage(position, "已關閉");
            return;
          }

          const track = config.captions.find((item) => item.code === language);
          if (!track) throw new Error(`找不到字幕設定：${language}`);

          setCaptionMessage(position, "正在載入……");
          const response = await fetch(track.src, { cache: "no-store" });
          if (!response.ok) throw new Error(`字幕載入失敗：HTTP ${response.status}`);

          trackState.activeCues = parseVtt(await response.text());
          if (!trackState.activeCues.length) throw new Error("字幕檔沒有可用的 VTT cue");

          setCaptionMessage(position, `${trackState.activeCues.length} 段已就緒`);
          updateCaption(position);
        }

        const STYLE_SHADOWS = {
          none: "none",
          soft: "0 1px 3px #000",
          strong: "0 2px 5px #000, 0 0 2px #000",
        };

        function clampNumber(value, minimum, maximum, fallback) {
          return Number.isFinite(value)
            ? Math.min(maximum, Math.max(minimum, value))
            : fallback;
        }

        function safeColor(value, fallback) {
          return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value)
            ? value
            : fallback;
        }

        function transparentColor(value, opacity) {
          const color = safeColor(value, "#030b0c");
          const red = Number.parseInt(color.slice(1, 3), 16);
          const green = Number.parseInt(color.slice(3, 5), 16);
          const blue = Number.parseInt(color.slice(5, 7), 16);
          return `rgb(${red} ${green} ${blue} / ${Math.round(opacity * 100)}%)`;
        }

        function applyCaptionStyles(styles) {
          for (const position of ["primary", "secondary"]) {
            const style = styles?.[position];
            if (!style) continue;
            const box = captionBoxes[position];
            const scale = clampNumber(style.fontScale, 0.7, 2, 1);
            const opacity = clampNumber(style.backgroundOpacity, 0, 1, 0.72);
            const paddingX = clampNumber(style.paddingX, 0, 1.5, 0.7);
            const paddingY = clampNumber(style.paddingY, 0, 1, 0.38);
            box.style.fontSize = `clamp(${scale}rem, ${2.15 * scale}vw, ${1.55 * scale}rem)`;
            box.style.fontWeight = String(clampNumber(style.fontWeight, 400, 800, 650));
            box.style.color = safeColor(style.textColor, "#ffffff");
            box.style.background = transparentColor(style.backgroundColor, opacity);
            box.style.lineHeight = String(clampNumber(style.lineHeight, 1, 2, 1.3));
            box.style.padding = `${paddingY}em ${paddingX}em`;
            box.style.borderRadius = `${clampNumber(style.radius, 0, 0.8, 0.18)}em`;
            box.style.textShadow = STYLE_SHADOWS[style.shadow] || STYLE_SHADOWS.soft;
            box.style.letterSpacing = `${clampNumber(style.letterSpacing, -0.05, 0.1, 0)}em`;
          }
          captionContainer.style.gap = `${clampNumber(styles?.bilingual?.gap, 0, 2, 0.5)}rem`;
        }

        function setPlaybackStatus(message, badge) {
          status.textContent = message;
          runtimeBadge.textContent = badge;
        }

        engineLabel.textContent = isEmbedded ? "ENGINE · NATIVE EMBED" : "ENGINE · NATIVE VIDEO";
        setPlaybackStatus("本機原生播放器已建立。", "READY");

        video.addEventListener("loadedmetadata", () => {
          const duration = Number.isFinite(video.duration) ? Math.round(video.duration) : 0;
          setPlaybackStatus(`影音已載入，長度約 ${duration} 秒。`, "READY");
          postToParent("player:ready", { duration: video.duration });
        });
        video.addEventListener("playing", () => {
          setPlaybackStatus("播放中。字幕依本機時間軸同步。", "PLAYING");
          cancelAnimationFrame(animationFrame);
          animationFrame = requestAnimationFrame(followPlayback);
          postToParent("player:playing", { time: video.currentTime });
        });
        video.addEventListener("pause", () => {
          cancelAnimationFrame(animationFrame);
          updateCaptions();
          if (!video.ended) setPlaybackStatus("已暫停。", "PAUSED");
          postToParent("player:paused", { time: video.currentTime, duration: video.duration });
        });
        video.addEventListener("seeking", updateCaptions);
        video.addEventListener("timeupdate", () => {
          updateCaptions();
          const now = Date.now();
          if (now - lastTimeMessage >= 1500) {
            postToParent("player:time", { time: video.currentTime, duration: video.duration });
            lastTimeMessage = now;
          }
        });
        video.addEventListener("ended", () => {
          setPlaybackStatus("播放完畢。", "ENDED");
          postToParent("player:ended", { duration: video.duration });
        });
        video.addEventListener("error", () => {
          setPlaybackStatus("影音載入失敗。請確認 video.mp4 存在並透過 HTTP 開啟。", "ERROR");
          postToParent("player:error", { code: video.error?.code || 0 });
        });

        Object.entries(captionLanguages).forEach(([position, select]) => {
          select.addEventListener("change", async () => {
            try {
              await loadCaptions(position, select.value);
            } catch (error) {
              captionTracks[position].activeCues = [];
              captionBoxes[position].hidden = true;
              setCaptionMessage(position, error.message, true);
            }
          });
        });

        const configuredDefault = config.captions.some((track) => track.code === config.defaultLanguage)
          ? config.defaultLanguage
          : config.captions[0]?.code || "off";
        captionLanguages.primary.value = configuredDefault;
        captionLanguages.secondary.value = "off";
        applyCaptionStyles(config.captionStyles);
        loadCaptions("primary", configuredDefault).catch((error) => setCaptionMessage("primary", error.message, true));
        loadCaptions("secondary", "off").catch((error) => setCaptionMessage("secondary", error.message, true));

        window.addEventListener("message", (event) => {
          if (!isEmbedded || event.source !== window.parent || event.origin !== window.location.origin) return;
          const message = event.data || {};
          if (message.type === "player:pause") video.pause();
          if (message.type === "player:dispose") {
            video.pause();
            cancelAnimationFrame(animationFrame);
            postToParent("player:disposed", { time: video.currentTime });
          }
          if (message.type === "player:seek" && Number.isFinite(message.time)) {
            const upper = Number.isFinite(video.duration) ? Math.max(0, video.duration - 1) : message.time;
            video.currentTime = Math.max(0, Math.min(message.time, upper));
            updateCaptions();
          }
          if (message.type === "player:set-captions") {
            const requested = {
              primary: message.primaryLanguage,
              secondary: message.secondaryLanguage,
            };
            for (const position of ["primary", "secondary"]) {
              const language = requested[position];
              const select = captionLanguages[position];
              const available = typeof language === "string" && [...select.options].some((option) => option.value === language);
              if (available && select.value !== language) {
                select.value = language;
                select.dispatchEvent(new Event("change"));
              }
            }
            applyCaptionStyles(message.styles);
          }
        });
      })();
    </script>
  </body>
</html>
