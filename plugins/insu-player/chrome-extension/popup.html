<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INSU Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">INSU PLAYER</span>
        <h1>加入目前影音</h1>
      </div>
      <button id="open-library" class="icon-button" type="button" aria-label="開啟影片中心" title="開啟影片中心">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>

    <main>
      <div id="connection" class="status" role="status">正在連接本機服務</div>
      <section id="connect-section" hidden>
        <p class="connection-help">這份 ZIP 會自動連接產生它的 INSU Player，不需要另外選擇設定檔。</p>
        <button id="retry-connection" class="primary" type="button">重新嘗試連接</button>
        <button id="open-install" class="secondary" type="button">開啟 INSU Player</button>
      </section>
      <section id="source-section" hidden>
        <p id="page-title" class="page-title"></p>
        <p class="consent-notice">點擊以下按鈕代表有權下載、轉錄與觀看這項內容，且同意把這組來源需要的 Cookie 傳到本機服務，只供這次下載使用。</p>
        <button id="enqueue" class="primary" type="button" disabled>加入下載佇列</button>
      </section>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
