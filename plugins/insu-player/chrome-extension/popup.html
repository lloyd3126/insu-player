<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INSU Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">INSU PLAYER</span>
        <h1>加入目前影音</h1>
      </div>
      <button id="open-library" class="icon-button" type="button" aria-label="開啟影片中心" title="開啟影片中心">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </button>
    </header>

    <main>
      <div id="connection" class="status" role="status">正在連接本機服務</div>
      <section id="source-section" hidden>
        <p id="page-title" class="page-title"></p>
        <div id="candidate-list" class="candidate-list" role="radiogroup" aria-label="選擇影音來源"></div>
        <button id="advanced-scan" class="secondary" type="button">偵測 iframe 與串流</button>
        <label class="check-row">
          <input id="rights" type="checkbox" />
          <span>我有權下載、轉錄與觀看這項內容</span>
        </label>
        <label class="check-row">
          <input id="use-session" type="checkbox" />
          <span>這個頁面需要目前 Chrome 的登入狀態</span>
        </label>
        <button id="enqueue" class="primary" type="button" disabled>加入下載佇列</button>
      </section>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </main>

    <dialog id="cookie-consent">
      <form method="dialog">
        <span class="eyebrow">BROWSER SESSION</span>
        <h2>只用於這一次下載</h2>
        <p>INSU Player 會把目前來源需要的 Cookie 傳到本機服務，建立短期檔案供 yt-dlp 使用。Cookie 不會寫入 app.db 或工作紀錄，下載結束就會刪除。</p>
        <div class="dialog-actions">
          <button id="cookie-cancel" type="button" class="secondary">取消</button>
          <button id="cookie-confirm" type="button" class="primary">同意並繼續</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
