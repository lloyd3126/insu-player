<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071617" />
    <title>Xeruca Player · 本機放映室</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f2e7d5;
        --muted: #a8aaa0;
        --line: rgb(244 240 232 / 14%);
        --panel: #0c2020;
        --panel-raised: #112a29;
        --black: #071617;
        --signal: #ff6542;
        --signal-soft: #57d7bf;
        --danger: #ff7b70;
        --plyr-color-main: var(--signal);
        font-family: "Avenir Next", Avenir, "PingFang TC", sans-serif;
        background: var(--black);
        color: var(--ink);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--black);
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
        content: "";
        opacity: 0.55;
        pointer-events: none;
      }

      body::after {
        position: fixed;
        top: 110px;
        right: -230px;
        z-index: -2;
        width: 540px;
        height: 540px;
        border: 1px solid rgb(87 215 191 / 16%);
        border-radius: 50%;
        box-shadow: 0 0 0 62px rgb(87 215 191 / 3%), 0 0 0 124px rgb(87 215 191 / 1.5%);
        content: "";
        pointer-events: none;
      }

      main {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(32px, 6vw, 76px) 0 56px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        margin-bottom: 24px;
      }

      .player-brand {
        display: inline-flex;
        gap: 11px;
        align-items: center;
        margin-bottom: clamp(28px, 5vw, 58px);
        color: var(--ink);
        font-size: .72rem;
        font-weight: 750;
        letter-spacing: .17em;
      }

      .player-brand svg {
        width: 36px;
        height: 36px;
        fill: none;
        stroke: var(--signal);
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .player-brand .play-mark { fill: var(--ink); stroke: none; }

      .player-brand small {
        display: block;
        margin-top: 5px;
        color: #647775;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: .52rem;
        letter-spacing: .08em;
      }

      .kicker {
        margin: 0 0 8px;
        color: var(--signal-soft);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 18ch;
        margin: 0;
        font-family: "Iowan Old Style", "Songti TC", Baskerville, serif;
        font-size: clamp(2rem, 4.7vw, 4.9rem);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 0.94;
        text-wrap: balance;
      }

      .runtime-badge {
        display: inline-flex;
        gap: 9px;
        align-items: center;
        padding: 9px 12px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .runtime-badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--signal);
        box-shadow: 0 0 16px rgb(255 101 66 / 75%);
        content: "";
      }

      .player-shell {
        overflow: hidden;
        border: 1px solid var(--line);
        background: #000;
        box-shadow: 12px 12px 0 rgb(255 101 66 / 10%), 0 28px 80px rgb(0 0 0 / 55%);
      }

      .player-wrap {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .player-wrap video,
      .player-wrap .plyr {
        width: 100%;
        height: 100%;
      }

      .player-wrap video {
        display: block;
        object-fit: contain;
      }

      .custom-caption {
        position: absolute;
        right: 6%;
        bottom: clamp(4.4rem, 9%, 6.4rem);
        left: 6%;
        z-index: 3;
        width: fit-content;
        max-width: 88%;
        margin: 0 auto;
        padding: 0.42em 0.72em 0.48em;
        border-radius: 0.12em;
        background: rgb(3 11 12 / 86%);
        box-decoration-break: clone;
        color: #fff;
        font-family: "Avenir Next", Avenir, "PingFang TC", sans-serif;
        font-size: clamp(1rem, 2.15vw, 1.55rem);
        font-weight: 650;
        line-height: 1.42;
        text-align: center;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }

      .custom-caption[hidden] {
        display: none;
      }

      .control-deck {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.6fr);
        border-top: 1px solid var(--line);
        background: var(--panel);
      }

      .status-panel,
      .caption-panel {
        min-height: 112px;
        padding: 22px 24px;
      }

      .caption-panel {
        border-left: 1px solid var(--line);
        background: var(--panel-raised);
      }

      .label {
        display: block;
        margin-bottom: 9px;
        color: var(--muted);
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .status {
        margin: 0;
        color: var(--ink);
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .caption-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      select {
        min-width: 145px;
        border: 0;
        border-bottom: 1px solid #58544b;
        border-radius: 0;
        padding: 8px 28px 8px 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }

      select:focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 4px;
      }

      .caption-status {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .caption-status[data-error="true"] {
        color: var(--danger);
      }

      .footnote {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 16px;
        color: #77736c;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.68rem;
        line-height: 1.5;
      }

      body.embed {
        min-height: 0;
        overflow: hidden;
        background: #000;
      }

      body.embed::before,
      body.embed::after,
      body.embed .masthead,
      body.embed .control-deck,
      body.embed .footnote {
        display: none;
      }

      body.embed main {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      body.embed .player-shell {
        border: 0;
        box-shadow: none;
      }

      body.embed .player-wrap {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
      }

      @media (max-width: 720px) {
        main {
          width: min(100% - 24px, 1180px);
          padding-top: 28px;
        }

        .masthead,
        .control-deck {
          grid-template-columns: 1fr;
        }

        .runtime-badge {
          justify-self: start;
        }

        .caption-panel {
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .status-panel,
        .caption-panel {
          min-height: auto;
          padding: 18px;
        }

        .custom-caption {
          bottom: 3.6rem;
        }

        .footnote {
          display: block;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .masthead,
        .player-shell,
        .footnote {
          animation: arrive 520ms ease-out both;
        }

        .player-shell {
          animation-delay: 80ms;
        }

        .footnote {
          animation-delay: 150ms;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header class="masthead">
        <div>
          <div class="player-brand" aria-label="Xeruca Player">
            <svg viewBox="0 0 56 56" aria-hidden="true"><path d="M17 31c0-8 5-14 13-14 4 0 8 2 10 5l7-8c3 8 0 16-7 20-2 7-8 11-15 10-7-1-11-6-8-13Z"/><path class="play-mark" d="m24 24 11 7-11 7Z"/><path d="M18 39 9 47M25 43l-3 9M36 40l8 8"/></svg>
            <span>XERUCA PLAYER<small>TAIWAN TIDELINE EDITION</small></span>
          </div>
          <p id="kicker" class="kicker">Xeruca · local screening</p>
          <h1 id="page-title">本機字幕放映室</h1>
        </div>
        <span id="runtime-badge" class="runtime-badge">INITIALIZING</span>
      </header>

      <section class="player-shell" aria-label="本機影片播放器">
        <div class="player-wrap">
          <video id="player" playsinline controls preload="metadata"></video>
          <div id="custom-caption" class="custom-caption" aria-live="polite" hidden></div>
        </div>

        <div class="control-deck">
          <div class="status-panel">
            <span class="label">Playback status</span>
            <p id="status" class="status">正在讀取影片設定……</p>
          </div>

          <div class="caption-panel">
            <label class="label" for="caption-language">Subtitle track</label>
            <div class="caption-row">
              <select id="caption-language" aria-describedby="caption-status"></select>
              <span id="caption-status" class="caption-status">等待載入</span>
            </div>
          </div>
        </div>
      </section>

      <footer class="footnote">
        <span>HTTP REQUIRED · VTT SYNCED LOCALLY</span>
        <span id="engine-label">ENGINE · NATIVE VIDEO</span>
      </footer>
    </main>

    <script src="config.js"></script>
    <script>
      (() => {
        "use strict";

        const defaults = {
          videoId: "standalone",
          title: "Xeruca Player · 本機字幕放映室",
          kicker: "Xeruca · local screening",
          video: { src: "video.mp4", type: "video/mp4" },
          defaultLanguage: "zh-TW",
          captions: [
            { code: "zh-TW", label: "繁體中文", src: "captions.zh-TW.vtt" },
            { code: "en", label: "English", src: "captions.en.vtt" },
          ],
        };

        const supplied = window.XERUCA_PLAYER_CONFIG || {};
        const config = {
          ...defaults,
          ...supplied,
          video: { ...defaults.video, ...(supplied.video || {}) },
          captions: Array.isArray(supplied.captions) ? supplied.captions : defaults.captions,
        };

        const video = document.querySelector("#player");
        const status = document.querySelector("#status");
        const pageTitle = document.querySelector("#page-title");
        const kicker = document.querySelector("#kicker");
        const runtimeBadge = document.querySelector("#runtime-badge");
        const engineLabel = document.querySelector("#engine-label");
        const captionBox = document.querySelector("#custom-caption");
        const captionLanguage = document.querySelector("#caption-language");
        const captionStatus = document.querySelector("#caption-status");

        let activeCues = [];
        let lastCueIndex = -1;
        let animationFrame = 0;
        let lastTimeMessage = 0;

        const isEmbedded = window.parent !== window && new URLSearchParams(window.location.search).get("embed") === "1";
        if (isEmbedded) document.body.classList.add("embed");

        function postToParent(type, extra = {}) {
          if (!isEmbedded) return;
          window.parent.postMessage({ type, videoId: config.videoId, ...extra }, window.location.origin);
        }

        document.title = config.title;
        pageTitle.textContent = config.title;
        kicker.textContent = config.kicker;
        const videoSource = document.createElement("source");
        videoSource.src = config.video.src;
        if (config.video.type) videoSource.type = config.video.type;
        video.append(videoSource);

        const offOption = new Option("關閉字幕", "off");
        captionLanguage.add(offOption);
        config.captions.forEach((track) => {
          captionLanguage.add(new Option(track.label, track.code));
        });

        function parseTimecode(value) {
          const parts = value.trim().replace(",", ".").split(":");
          if (parts.length === 2) parts.unshift("0");
          if (parts.length !== 3) return Number.NaN;
          return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + Number(parts[2]);
        }

        function cleanCueText(value) {
          return value
            .replace(/<\/?c(?:\.[^>]*)?>/g, "")
            .replace(/<\d{2}:\d{2}(?::\d{2})?\.\d{3}>/g, "")
            .replace(/<[^>]*>/g, "")
            .replace(/&nbsp;/g, " ")
            .replace(/&amp;/g, "&")
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/\s+/g, " ")
            .trim();
        }

        function parseVtt(source) {
          const lines = source.replace(/^\uFEFF/, "").replace(/\r/g, "").split("\n");
          const cues = [];

          for (let index = 0; index < lines.length; index += 1) {
            const timing = lines[index].match(/^(\S+)\s+-->\s+(\S+)/);
            if (!timing) continue;

            const textLines = [];
            let nextIndex = index + 1;
            while (nextIndex < lines.length && !/^\S+\s+-->\s+\S+/.test(lines[nextIndex])) {
              const line = lines[nextIndex].trim();
              if (line && !line.startsWith("NOTE")) textLines.push(lines[nextIndex]);
              nextIndex += 1;
            }

            const start = parseTimecode(timing[1]);
            const end = parseTimecode(timing[2]);
            const text = cleanCueText(textLines.join("\n"));
            if (text && Number.isFinite(start) && Number.isFinite(end) && end > start) {
              cues.push({ start, end, text });
            }
            index = nextIndex - 1;
          }

          return cues.sort((a, b) => a.start - b.start);
        }

        function findCueIndex(currentTime) {
          if (
            lastCueIndex >= 0 &&
            activeCues[lastCueIndex] &&
            currentTime >= activeCues[lastCueIndex].start &&
            currentTime < activeCues[lastCueIndex].end
          ) {
            return lastCueIndex;
          }

          let low = 0;
          let high = activeCues.length - 1;
          while (low <= high) {
            const middle = Math.floor((low + high) / 2);
            const cue = activeCues[middle];
            if (currentTime < cue.start) high = middle - 1;
            else if (currentTime >= cue.end) low = middle + 1;
            else return middle;
          }
          return -1;
        }

        function updateCaption() {
          const cueIndex = findCueIndex(video.currentTime || 0);
          lastCueIndex = cueIndex;
          const text = cueIndex >= 0 ? activeCues[cueIndex].text : "";
          captionBox.textContent = text;
          captionBox.hidden = !text;
        }

        function followPlayback() {
          updateCaption();
          if (!video.paused && !video.ended) {
            animationFrame = requestAnimationFrame(followPlayback);
          }
        }

        function setCaptionMessage(message, isError = false) {
          captionStatus.textContent = message;
          captionStatus.dataset.error = String(isError);
        }

        async function loadCaptions(language) {
          cancelAnimationFrame(animationFrame);
          captionBox.hidden = true;
          lastCueIndex = -1;

          if (language === "off") {
            activeCues = [];
            setCaptionMessage("已關閉");
            return;
          }

          const track = config.captions.find((item) => item.code === language);
          if (!track) throw new Error(`找不到字幕設定：${language}`);

          setCaptionMessage("正在載入……");
          const response = await fetch(track.src, { cache: "no-store" });
          if (!response.ok) throw new Error(`字幕載入失敗：HTTP ${response.status}`);

          activeCues = parseVtt(await response.text());
          if (!activeCues.length) throw new Error("字幕檔沒有可用的 VTT cue");

          setCaptionMessage(`${activeCues.length} 段已就緒`);
          updateCaption();
        }

        function setPlaybackStatus(message, badge) {
          status.textContent = message;
          runtimeBadge.textContent = badge;
        }

        engineLabel.textContent = isEmbedded ? "ENGINE · NATIVE EMBED" : "ENGINE · NATIVE VIDEO";
        setPlaybackStatus("本機原生播放器已建立。", "READY");

        video.addEventListener("loadedmetadata", () => {
          const duration = Number.isFinite(video.duration) ? Math.round(video.duration) : 0;
          setPlaybackStatus(`影片已載入，長度約 ${duration} 秒。`, "READY");
          postToParent("player:ready", { duration: video.duration });
        });
        video.addEventListener("playing", () => {
          setPlaybackStatus("播放中；字幕依本機時間軸同步。", "PLAYING");
          cancelAnimationFrame(animationFrame);
          animationFrame = requestAnimationFrame(followPlayback);
          postToParent("player:playing", { time: video.currentTime });
        });
        video.addEventListener("pause", () => {
          cancelAnimationFrame(animationFrame);
          updateCaption();
          if (!video.ended) setPlaybackStatus("已暫停。", "PAUSED");
          postToParent("player:paused", { time: video.currentTime, duration: video.duration });
        });
        video.addEventListener("seeking", updateCaption);
        video.addEventListener("timeupdate", () => {
          updateCaption();
          const now = Date.now();
          if (now - lastTimeMessage >= 1500) {
            postToParent("player:time", { time: video.currentTime, duration: video.duration });
            lastTimeMessage = now;
          }
        });
        video.addEventListener("ended", () => {
          setPlaybackStatus("播放完畢。", "ENDED");
          postToParent("player:ended", { duration: video.duration });
        });
        video.addEventListener("error", () => {
          setPlaybackStatus("影片載入失敗；請確認 video.mp4 存在並透過 HTTP 開啟。", "ERROR");
          postToParent("player:error", { code: video.error?.code || 0 });
        });

        captionLanguage.addEventListener("change", async () => {
          try {
            await loadCaptions(captionLanguage.value);
          } catch (error) {
            activeCues = [];
            captionBox.hidden = true;
            setCaptionMessage(error.message, true);
          }
        });

        const configuredDefault = config.captions.some((track) => track.code === config.defaultLanguage)
          ? config.defaultLanguage
          : config.captions[0]?.code || "off";
        captionLanguage.value = configuredDefault;
        loadCaptions(configuredDefault).catch((error) => setCaptionMessage(error.message, true));

        window.addEventListener("message", (event) => {
          if (!isEmbedded || event.source !== window.parent || event.origin !== window.location.origin) return;
          const message = event.data || {};
          if (message.type === "player:pause") video.pause();
          if (message.type === "player:dispose") {
            video.pause();
            cancelAnimationFrame(animationFrame);
            postToParent("player:disposed", { time: video.currentTime });
          }
          if (message.type === "player:seek" && Number.isFinite(message.time)) {
            const upper = Number.isFinite(video.duration) ? Math.max(0, video.duration - 1) : message.time;
            video.currentTime = Math.max(0, Math.min(message.time, upper));
            updateCaption();
          }
          if (message.type === "player:set-caption" && typeof message.language === "string") {
            const available = [...captionLanguage.options].some((option) => option.value === message.language);
            if (available) {
              captionLanguage.value = message.language;
              captionLanguage.dispatchEvent(new Event("change"));
            }
          }
        });
      })();
    </script>
  </body>
</html>
